[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Config-driven factor research framework: signal registry, cost-aware backtest engine, auto-generated research reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "lxml>=4.9",
    "requests>=2.28",
    "tabulate>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quant-backtest = "quant_research.cli:main"

[tool.setuptools]
packages = ["quant_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
